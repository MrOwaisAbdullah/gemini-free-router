project: single
listen:
  host: 127.0.0.1
  port: 8787

# --- Account plan (free | pro) ----------------------------------------------
#   plan: free   (default) → built-in default limits are the free-tier
#                            numbers captured from AI Studio
#   plan: pro               → scales the built-in defaults x4 (Google's
#                            published Pro-vs-free usage ratio). The 429
#                            forensics learner (GFR_LEARN=1) then converges
#                            to your project's real rpm/rpd/tpm from the
#                            first quota response.
#
# Exact per-model Pro numbers live only in your account's console:
#   aistudio.google.com/rate-limit
# Copy them with fleet_mode: merge — explicit config numbers always win and
# are never scaled. An explicit `fleet:` list in replace mode is likewise
# taken as-is. Env GFR_PLAN=free|pro overrides this file.
# plan: pro

# --- Fleet maintenance -----------------------------------------------------
# Models appear/deprecate and Google revises free-tier limits; maintain them
# here without editing code:
#
#   fleet_mode: replace   (default) → the `fleet` list below IS the whole fleet
#   fleet_mode: merge                → overlay onto the built-in defaults:
#                                      listed ids override just the fields given,
#                                      unknown ids are appended, `disabled` drops ids
#
# fleet_mode: merge
# disabled:                                # drop deprecated models by id
#   - gemini-2.5-flash-lite
# fleet:
#   - { model: gemini-2.5-flash, rpm: 8, rpd: 50 }                  # retune limits
#   - { model: gemini-4-flash, rpm: 5, rpd: 20, tpm: 250000, tier: scarce }  # add a model
#
# Config is validated at boot; a typo fails fast with a clear error.
# Limits learned from 429s (GFR_LEARN=1) auto-clear for any model whose
# configured rpm/rpd/tpm you change — your edit always wins on restart.
# -----------------------------------------------------------------------------
fleet:
  - model: gemini-3.1-flash-lite
    rpm: 15
    rpd: 500
    tpm: 250000
    tier: bulk
    alias: fast
  - model: gemini-3.5-flash-lite
    rpm: 15
    rpd: 500
    tpm: 250000
    tier: bulk
  - model: gemini-3.5-flash
    rpm: 5
    rpd: 20
    tpm: 250000
    tier: scarce
pacing:
  max_queue_wait_s: 30
  burn_curve: even
  max_in_flight_per_model: auto
fallback:
  strategy: remaining-budget
learning:
  auto_apply: false
modalities: [chat]
ledger_path: ./data/ledger.sqlite
